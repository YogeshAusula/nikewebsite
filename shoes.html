<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .product-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            text-align: center;
            padding: 20px;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .product-name {
            font-size: 1.5rem;
            color: #333333;
            margin: 15px 0 10px 0;
        }
        .product-description {
            font-size: 0.95rem;
            color: #666666;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .product-price {
            font-size: 1.25rem;
            color: #e44d26;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <!-- Replace the src URL with your actual image link -->
        <img class="product-image" src="https://via.placeholder.com/250" alt="Minimalist Wireless Headphones">
        
        <h1 class="product-name">SoundWave Wireless Headphones</h1>
        
        <p class="product-description">
            Experience crystal-clear audio and ultimate comfort with up to 40 hours of battery life and active noise cancellation.
        </p>
        
        <div class="product-price">$129.99</div>
    </div>

</body>
</html>
