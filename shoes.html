<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page - GadgetCentral</title>
    <style>
        /* Base Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            text-align: left;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Main Container (Sidebar + Content) */
        .main-container {
            display: flex;
            flex: 1; /* Takes up remaining vertical space */
        }

        /* Sidebar Styles */
        aside {
            background-color: #2c3e50;
            width: 220px;
            padding: 20px 10px;
        }
        aside ul {
            list-style-type: none;
        }
        aside ul li {
            margin-bottom: 15px;
        }
        aside ul li a {
            color: #ecf0f1;
            text-decoration: none;
            font-size: 1.1rem;
            display: block;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        aside ul li a:hover {
            background-color: #34495e;
        }

        /* Content Area Styles */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        /* Product Card Styles (from Task 1) */
        .product-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            text-align: center;
            padding: 20px;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .product-name {
            font-size: 1.5rem;
            color: #333333;
            margin: 15px 0 10px 0;
        }
        .product-description {
            font-size: 0.95rem;
            color: #666666;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .product-price {
            font-size: 1.25rem;
            color: #e44d26;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <H1>NIKE AIR MAX</H1>       
    </header>

    <!-- Main Page Layout Wrapper -->
    <div class="main-container">
        
        <!-- Sidebar Navigation -->
        <aside>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Product Content -->
        <main>
            <div class="product-card">
                <!-- Replace the src URL with your actual image link -->
                <img class="product-image" src="nike shoes.jpg" alt="Nike Shoes">
                
                <h1 class="product-name">Nike Air Max</h1>
                
                <p class="product-description">
                    Experience crystal-stylist and comfortable fit with the Nike Air Max. Designed for both style and performance, these shoes feature a sleek design and advanced cushioning technology to keep you comfortable all day long.
                </p>
                
                <div class="product-price">$499.99</div>
            </div>
        </main>

    </div>

</body>
</html>
